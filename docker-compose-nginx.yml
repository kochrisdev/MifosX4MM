# ─── Volumes ──────────────────────────────────────────────────────────────────
volumes:
  postgres_data:
  keycloak_data:
  mysql_data:

# ─── Networks ─────────────────────────────────────────────────────────────────
networks:
  mifos_net:
    driver: bridge

services:

  # ── PostgreSQL ───────────────────────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: mifos
      POSTGRES_PASSWORD: 171210bfbcbadfb89cd55ca50d4d084b69a5782b4bb204ebdfae86b218d7f305
      POSTGRES_DB: fineract_default
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Creates the `keycloak` and `mifostenant_default` databases on first boot
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks: [mifos_net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mifos"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── MySQL (Fineract's native database) ────────────────────────────────────────
  mysql:
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: d5b9f6f6eb071373fc6af60318cf62532d8dc5c6a3ccb0f29d3af7ee22ee9660
      MYSQL_DATABASE: fineract_tenants
    volumes:
      - mysql_data:/var/lib/mysql
      - ./infra/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks: [mifos_net]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pd5b9f6f6eb071373fc6af60318cf62532d8dc5c6a3ccb0f29d3af7ee22ee9660"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Apache Fineract ───────────────────────────────────────────────────────────
  fineract:
    image: apache/fineract:latest
    environment:
      FINERACT_DEFAULT_TENANTDB_HOSTNAME: mysql
      FINERACT_DEFAULT_TENANTDB_PORT: 3306
      FINERACT_DEFAULT_TENANTDB_UID: root
      FINERACT_DEFAULT_TENANTDB_PWD: d5b9f6f6eb071373fc6af60318cf62532d8dc5c6a3ccb0f29d3af7ee22ee9660
      FINERACT_DEFAULT_TENANTDB_CONN_PARAMS: ""
      FINERACT_HIKARI_JDBC_URL: jdbc:mariadb://mysql:3306/fineract_tenants
      FINERACT_HIKARI_USERNAME: root
      FINERACT_HIKARI_PASSWORD: d5b9f6f6eb071373fc6af60318cf62532d8dc5c6a3ccb0f29d3af7ee22ee9660
      FINERACT_TENANTS_MASTER_JDBC_URL: jdbc:mariadb://mysql:3306/fineract_tenants
      FINERACT_SERVER_SSL_ENABLED: "false"
      FINERACT_SERVER_PORT: 8080
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
    networks: [mifos_net]

  # ── Keycloak ─────────────────────────────────────────────────────────────────
  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    # --import-realm auto-imports JSON files placed in /opt/keycloak/data/import/
    command: start-dev --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: mifos
      KC_DB_PASSWORD: 171210bfbcbadfb89cd55ca50d4d084b69a5782b4bb204ebdfae86b218d7f305
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    volumes:
      - ./infra/keycloak/realm-mifos.json:/opt/keycloak/data/import/realm-mifos.json:ro
    ports:
      - "127.0.0.1:8180:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks: [mifos_net]

  # ── API Gateway ───────────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.node
      args:
        SERVICE_PATH: apps/api
    env_file: .env
    environment:
      FINERACT_URL: http://fineract:8080/fineract-provider/api/v1
      KEYCLOAK_URL: http://keycloak:8080
      MOBILE_MONEY_SVC_URL: http://mobile-money:3003
      KYC_SVC_URL: http://kyc:3004
      REPORTING_SVC_URL: http://reporting:3005
    ports:
      - "127.0.0.1:3001:3001"
    depends_on: [fineract, keycloak]
    networks: [mifos_net]

  # ── Web Frontend ──────────────────────────────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.web
      args:
        NEXT_PUBLIC_API_URL: https://api.mifosx.com
    env_file: .env
    ports:
      - "127.0.0.1:3000:3000"
    depends_on: [api]
    networks: [mifos_net]

  # ── Mobile Money Service ──────────────────────────────────────────────────────
  mobile-money:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.node
      args:
        SERVICE_PATH: services/mobile-money
    env_file: .env
    ports:
      - "127.0.0.1:3003:3003"
    networks: [mifos_net]

  # ── KYC Service ───────────────────────────────────────────────────────────────
  kyc:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.node
      args:
        SERVICE_PATH: services/kyc
    env_file: .env
    networks: [mifos_net]

  # ── Reporting Service ─────────────────────────────────────────────────────────
  reporting:
    build:
      context: services/reporting
      dockerfile: ../../infra/docker/Dockerfile.python
    env_file: .env
    environment:
      REPORTING_DB_URL: postgresql://mifos:171210bfbcbadfb89cd55ca50d4d084b69a5782b4bb204ebdfae86b218d7f305@postgres:5432/fineract_default
      KYC_SVC_URL: http://kyc:3004
    depends_on:
      postgres:
        condition: service_healthy
    networks: [mifos_net]
